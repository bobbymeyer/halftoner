[project]
name = "halftoner"
version = "0.1.0"
description = "Ink-first halftone and press-profile renderer"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.scripts]
halftoner = "halftoner.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pypdf>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halftoner"]
